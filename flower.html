<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flor Amarilla para ti</title>
<style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      :root {
        --sky: linear-gradient(
          to bottom,
          #090b18 0%,
          #202038 30%,
          #9a4f2f 66%,
          #f0a62b 100%
        );
        --line-color: linear-gradient(
          to right,
          #173d20,
          #64b85b 45%,
          #173d20
        );
        --flower-center: radial-gradient(circle at 45% 40%, #40200a 0%, #180b05 45%, #070403 100%);
        --leaf-color: radial-gradient(circle at 40% 35%, #8bd66a, #1c642b 65%, #0b2f16);
        --petal-color: radial-gradient(circle at 50% 25%, #fff08a 0%, #ffd32f 35%, #e9930e 80%);
      }

      body {
        background-image:
          radial-gradient(circle at 50% 58%, rgba(255, 206, 85, .28), transparent 20%),
          var(--sky);
        min-height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
        position: relative;
        font-family: "Poppins", sans-serif;
      }

      /* Brillo suave de atardecer */
      body::before {
        content: "";
        position: absolute;
        width: 42vw;
        height: 42vw;
        min-width: 260px;
        min-height: 260px;
        max-width: 520px;
        max-height: 520px;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(255, 190, 54, .13);
        filter: blur(45px);
        pointer-events: none;
      }

      h1 {
        position: absolute;
        top: 24px;
        text-align: center;
        width: min(900px, 92vw);
        left: 50%;
        transform: translateX(-50%);
        color: #fff5cf;
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: clamp(22px, 3vw, 34px);
        line-height: 1.35;
        text-shadow: 0 3px 15px rgba(0, 0, 0, .65);
        z-index: 20;
      }

      .quote {
        display: block;
        margin-top: 8px;
        font-size: clamp(15px, 2vw, 21px);
        font-style: italic;
        color: #ffe8a3;
      }

      .flower_wrapper {
        position: absolute;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%);
        z-index: 5;
      }

      .flower_stem {
        width: 20px;
        height: 400px;
        background-image: var(--line-color);
        border-radius: 20px;
        box-shadow: 0 0 18px rgba(88, 183, 71, .25);
      }

      .flower_center {
        position: absolute;
        top: -93px;
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: var(--flower-center);
        z-index: 5;
        opacity: 0;
        box-shadow: 0 0 35px rgba(255, 188, 34, .28);
        animation: open-flower-center 1s ease-out forwards;
        animation-delay: 1s;
      }

      .flower_petal {
        position: absolute;
        width: 70px;
        height: 140px;
        background: var(--petal-color);
        clip-path: ellipse(35% 50% at 50% 50%);
        top: -40%;
        left: 50%;
        transform-origin: center bottom;
        opacity: 0;
        filter: drop-shadow(0 5px 5px rgba(0,0,0,.18));
        animation: open-flower-petal 1s ease-out forwards;
      }

      .flower_petal-1 { --rotate-deg: 0deg; animation-delay: 1.2s; }
      .flower_petal-2 { --rotate-deg: 30deg; animation-delay: 1.25s; }
      .flower_petal-3 { --rotate-deg: 60deg; animation-delay: 1.3s; }
      .flower_petal-4 { --rotate-deg: 90deg; animation-delay: 1.35s; }
      .flower_petal-5 { --rotate-deg: 120deg; animation-delay: 1.4s; }
      .flower_petal-6 { --rotate-deg: 150deg; animation-delay: 1.45s; }
      .flower_petal-7 { --rotate-deg: 180deg; animation-delay: 1.5s; }
      .flower_petal-8 { --rotate-deg: 210deg; animation-delay: 1.55s; }
      .flower_petal-9 { --rotate-deg: 240deg; animation-delay: 1.6s; }
      .flower_petal-10 { --rotate-deg: 270deg; animation-delay: 1.65s; }
      .flower_petal-11 { --rotate-deg: 300deg; animation-delay: 1.7s; }
      .flower_petal-12 { --rotate-deg: 330deg; animation-delay: 1.75s; }

      .flower_leaf {
        position: absolute;
        width: 70px;
        height: 120px;
        background: var(--leaf-color);
        border-radius: 100px 20px 100px 20px;
        transform-origin: center bottom;
        filter: drop-shadow(0 6px 7px rgba(0,0,0,.22));
      }

      .flower_leaf-1 {
        left: 60%;
        bottom: 150px;
        transform: translateX(-45%) rotate(80deg);
      }

      .flower_leaf-2 {
        left: 60%;
        bottom: 200px;
        transform: translateX(-55%) rotate(-80deg);
      }

      @keyframes open-flower-petal {
        0% {
          transform: translateX(-50%) translateY(50px) rotate(0deg);
          opacity: 0;
        }
        50% { opacity: 1; }
        100% {
          transform: translateX(-50%) translateY(0) rotate(var(--rotate-deg));
          opacity: 1;
        }
      }

      @keyframes open-flower-center {
        0% {
          transform: translateX(-50%) scale(0);
          opacity: 0;
        }
        100% {
          transform: translateX(-50%) scale(1);
          opacity: 1;
        }
      }

      .flower_light,
      .light {
        position: absolute;
        width: 9px;
        height: 9px;
        background-color: #ffe45c;
        border-radius: 50%;
        filter: blur(2px);
        z-index: 1;
      }

      .flower_light {
        bottom: 450px;
        animation: light-ans 4s linear infinite backwards;
      }

      .flower_light-1 { left: 5%; animation-delay: 1s; }
      .flower_light-2 { left: 15%; animation-delay: .5s; }
      .flower_light-3 { left: 25%; animation-delay: .3s; }
      .flower_light-4 { left: 35%; animation-delay: .9s; }
      .flower_light-5 { left: 45%; animation-delay: 1.5s; }
      .flower_light-6 { left: 55%; animation-delay: 3s; }
      .flower_light-7 { left: 65%; animation-delay: 2s; }
      .flower_light-8 { left: 75%; animation-delay: 3.5s; }

      .light {
        bottom: 0;
        animation: light-ans-background 7s linear infinite backwards;
      }

      .light-1 { left: 6%; animation-delay: 1s; }
      .light-2 { left: 16%; animation-delay: .5s; }
      .light-3 { left: 28%; animation-delay: .3s; }
      .light-4 { left: 38%; animation-delay: .9s; }
      .light-5 { left: 48%; animation-delay: 1.5s; }
      .light-6 { left: 58%; animation-delay: 3s; }
      .light-7 { left: 68%; animation-delay: 2s; }
      .light-8 { left: 78%; animation-delay: 3.5s; }
      .light-9 { left: 88%; animation-delay: 2s; }
      .light-10 { left: 94%; animation-delay: 3.5s; }
      .light-11 { left: 72%; animation-delay: 3s; }
      .light-12 { left: 22%; animation-delay: .5s; }

      @keyframes light-ans {
        0% { opacity: 0; transform: translateY(0) translateX(0); }
        25% { opacity: 1; transform: translateY(-50px) translateX(-20px); }
        50% { opacity: 1; transform: translateY(-150px) translateX(20px); }
        75% { transform: translateY(-200px) translateX(-20px); }
        100% { transform: translateY(-300px); opacity: 0; filter: blur(10px); }
      }

      @keyframes light-ans-background {
        0% { opacity: 0; transform: translateY(0) translateX(0); }
        25% { opacity: 1; transform: translateY(-100px) translateX(10px); }
        50% { transform: translateY(-200px) translateX(-10px); }
        75% { transform: translateY(-400px) translateX(15px); }
        100% { opacity: 0; transform: translateY(-600px) translateX(-5px); }
      }

      .petal-fall {
        position: absolute;
        top: -30px;
        color: #ffd34e;
        font-size: 20px;
        opacity: .65;
        z-index: 3;
        animation: fall linear infinite;
        pointer-events: none;
      }

      .pf1 { left: 12%; animation-duration: 8s; }
      .pf2 { left: 27%; animation-duration: 11s; animation-delay: 2s; }
      .pf3 { left: 72%; animation-duration: 9s; animation-delay: 1s; }
      .pf4 { left: 88%; animation-duration: 12s; animation-delay: 3s; }

      @keyframes fall {
        from { transform: translateY(-40px) rotate(0deg); }
        to { transform: translateY(110vh) rotate(360deg); }
      }

      .flower-btn {
        padding: 16px 42px;
        font-size: 18px;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        letter-spacing: .5px;
        color: #4d2b0c;
        background: linear-gradient(135deg, #fff0a6, #f6b62e);
        border: 1px solid rgba(255, 241, 168, .9);
        border-radius: 50px;
        cursor: pointer;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, .38),
          0 0 22px rgba(255, 196, 45, .30);
        transition: all .3s ease;
        position: relative;
        overflow: hidden;
        z-index: 999;
        margin: 25px 0;
      }

      .flower-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -80%;
        width: 55%;
        height: 100%;
        background: rgba(255,255,255,.5);
        transform: skewX(-20deg);
        transition: left .5s ease;
      }

      .flower-btn:hover::before {
        left: 130%;
      }

      .flower-btn:hover {
        transform: translateY(-4px) scale(1.03);
        box-shadow:
          0 14px 35px rgba(0,0,0,.45),
          0 0 30px rgba(255, 208, 70, .55);
      }

      .bottom-message {
        position: absolute;
        bottom: 18px;
        width: 100%;
        text-align: center;
        color: #ffe9a7;
        font-family: Georgia, serif;
        font-style: italic;
        font-size: 16px;
        z-index: 20;
        text-shadow: 0 2px 8px rgba(0,0,0,.6);
      }

      @media (max-width: 600px) {
        h1 {
          top: 15px;
          width: 92vw;
        }

        .flower_wrapper {
          bottom: 82px;
          transform: translateX(-50%) scale(.78);
          transform-origin: bottom center;
        }

        .flower-btn {
          margin-bottom: 35px;
          padding: 14px 32px;
          font-size: 16px;
        }

        .bottom-message {
          bottom: 10px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <audio id="id_audio" src="close to you.mp3" preload="auto"></audio>

    <h1>
      🌻 Para el amor de mi vida
      <span class="quote">“Porque entre tantas flores, yo siempre te elegiría a ti…” ❤️</span>
    </h1>

    <div class="petal-fall pf1">🌼</div>
    <div class="petal-fall pf2">🌻</div>
    <div class="petal-fall pf3">🌼</div>
    <div class="petal-fall pf4">🌻</div>

    <div class="sunflower">
      <div class="flower_wrapper">
        <div class="flower_stem"></div>
        <div class="flower_center"></div>
        <div class="flower_petal flower_petal-1"></div>
        <div class="flower_petal flower_petal-2"></div>
        <div class="flower_petal flower_petal-3"></div>
        <div class="flower_petal flower_petal-4"></div>
        <div class="flower_petal flower_petal-5"></div>
        <div class="flower_petal flower_petal-6"></div>
        <div class="flower_petal flower_petal-7"></div>
        <div class="flower_petal flower_petal-8"></div>
        <div class="flower_petal flower_petal-9"></div>
        <div class="flower_petal flower_petal-10"></div>
        <div class="flower_petal flower_petal-11"></div>
        <div class="flower_petal flower_petal-12"></div>

        <div class="flower_leaf flower_leaf-1"></div>
        <div class="flower_leaf flower_leaf-2"></div>

        <div class="flower_light flower_light-1"></div>
        <div class="flower_light flower_light-2"></div>
        <div class="flower_light flower_light-3"></div>
        <div class="flower_light flower_light-4"></div>
        <div class="flower_light flower_light-5"></div>
        <div class="flower_light flower_light-6"></div>
        <div class="flower_light flower_light-7"></div>
        <div class="flower_light flower_light-8"></div>
      </div>
    </div>

    <div class="light light-1"></div>
    <div class="light light-2"></div>
    <div class="light light-3"></div>
    <div class="light light-4"></div>
    <div class="light light-5"></div>
    <div class="light light-6"></div>
    <div class="light light-7"></div>
    <div class="light light-8"></div>
    <div class="light light-9"></div>
    <div class="light light-10"></div>
    <div class="light light-11"></div>
    <div class="light light-12"></div>

    <button class="flower-btn">CLICK AQUÍ 💛</button>

    <div class="bottom-message">
      La vida es más bonita contigo ❤️
    </div>

    <script>
      const flowerBtn = document.querySelector(".flower-btn");
      const audio = document.getElementById("id_audio");

      flowerBtn.onclick = () => {
        audio.volume = 0.8;
        audio.currentTime = 0;
        audio.play().catch(error => {
          console.log("El navegador bloqueó el audio:", error);
        });

        flowerBtn.textContent = "PARA TI ❤️";
      };
    </script>
  </body>
</html>
